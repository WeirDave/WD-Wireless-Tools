name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # The Windows / Python 3.10 job runs 26-31 minutes as the suite stands,
    # so a 30-minute cap cancelled healthy runs part-way through - main's own
    # push run for 2.182.0 among them. The cap is there to stop a hung job, not
    # to bound a slow one; 45 keeps that with room for the suite to grow.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    # No browser tests in these four jobs: they have jobs of their own below,
    # one per browser. `tests/browsers.py` reads this switch.
    env:
      WD_BROWSER_TESTS: 'off'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The no-real-data guard scans commit messages and every blob ever
          # committed. The default depth of 1 hides all of that, and the guard
          # would skip in the one place it most needs to run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # 57 test files drive the real render functions out of the .js through
      # node, and every one of them is gated on `shutil.which("node")` so a
      # developer without node still gets a green suite. That guard is correct
      # locally and a hole here: nothing installed node, so those 1,069 test
      # methods - half the suite - ran only because the runner image happens to
      # ship it. An image change would have skipped them silently and stayed
      # green. Installed deliberately now, and
      # tests/test_ci_runs_the_node_tests.py fails if it ever goes missing
      # again rather than letting the skip pass for a pass.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # Fourteen test files drive Firefox, Chrome and Edge, which is the
      # standard this repository holds itself to - a control is verified by
      # running it, not by finding its name. Every one of them is gated on
      # `from selenium import webdriver`, and nothing here installed it, so
      # all ~300 of them skipped on the runner and reported as a pass. That
      # is how a test stayed red from v2.163.0 through four releases: CI
      # could not see it, and locally three identical red lines every run
      # read as noise.
      #
      # Kept out of `requirements.txt` on purpose - that file ships in the
      # release payload and both installers run it against his machine.
      # `tests/test_ci_runs_the_browser_tests.py` fails if this step goes.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Which browsers the runner actually has, in the transcript, before
      # anything depends on the answer. A skip that nobody can see is the
      # thing being fixed here, so the inventory is printed rather than
      # inferred from a test count.
      - name: Report which browsers are available
        run: python -m tests.browsers_report

      # One module per process, as many at once as the runner has cores -
      # the runner had three or four and used one. `scripts/run_tests.py`
      # gives every module its own `WD_USER_DIR`, which under `discover` came
      # from test_0_user_dir_isolation.py sorting first.
      - name: Run safety suite
        run: python scripts/run_tests.py

      - name: Compile Python sources
        run: python -m compileall -q server.py tools tests

      - name: Check dependency consistency
        run: python -m pip check

  # The browser tests, one job per browser, next to the four above rather
  # than inside one of them.
  #
  # Inside a job they competed for its cores with the rest of the suite and
  # slowed badly: one module took 549 s alongside the other tests against 171 s
  # alone, so running browser modules side by side saved nothing and the job
  # stayed at 19 minutes. Split three ways, each job drives one browser and runs
  # only the modules that drive one. Windows, because that is what he runs.
  #
  # `WD_BROWSERS` narrows `tests.browsers.find` to this job's browser, so each
  # browser's tests run exactly once across the three.
  # `tests/test_ci_splits_and_parallelises_the_suite.py` holds that: the four
  # jobs above are off, and together these cover each browser once.
  browsers:
    name: ${{ matrix.browser }} / Windows
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chrome, edge]
    env:
      WD_BROWSER_TESTS: 'on'
      WD_BROWSERS: ${{ matrix.browser }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Report which browsers are available
        run: python -m tests.browsers_report

      - name: Run browser tests
        run: python scripts/run_tests.py --browsers-only
