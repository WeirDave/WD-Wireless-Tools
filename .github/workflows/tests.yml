name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.10', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The no-real-data guard scans commit messages and every blob ever
          # committed. The default depth of 1 hides all of that, and the guard
          # would skip in the one place it most needs to run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # 57 test files drive the real render functions out of the .js through
      # node, and every one of them is gated on `shutil.which("node")` so a
      # developer without node still gets a green suite. That guard is correct
      # locally and a hole here: nothing installed node, so those 1,069 test
      # methods - half the suite - ran only because the runner image happens to
      # ship it. An image change would have skipped them silently and stayed
      # green. Installed deliberately now, and
      # tests/test_ci_runs_the_node_tests.py fails if it ever goes missing
      # again rather than letting the skip pass for a pass.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fourteen test files drive Firefox, Chrome and Edge, which is the
      # standard this repository holds itself to - a control is verified by
      # running it, not by finding its name. Every one of them is gated on
      # `from selenium import webdriver`, and nothing here installed it, so
      # all ~300 of them skipped on the runner and reported as a pass. That
      # is how a test stayed red from v2.163.0 through four releases: CI
      # could not see it, and locally three identical red lines every run
      # read as noise.
      #
      # Kept out of `requirements.txt` on purpose - that file ships in the
      # release payload and both installers run it against his machine.
      # `tests/test_ci_runs_the_browser_tests.py` fails if this step goes.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Which browsers the runner actually has, in the transcript, before
      # anything depends on the answer. A skip that nobody can see is the
      # thing being fixed here, so the inventory is printed rather than
      # inferred from a test count.
      - name: Report which browsers are available
        run: python -m tests.browsers_report

      - name: Run safety suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q server.py tools tests

      - name: Check dependency consistency
        run: python -m pip check
