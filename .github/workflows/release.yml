# Attach assets to a release that was published by hand, or backfill one.
#
# The routine path is `auto-release.yml`: a suite version bump on main tags and
# publishes by itself. This remains for the two cases that are not that - a
# release created through the GitHub UI, and re-running the packaging for a tag
# whose assets failed to build or were removed.
#
# The build itself lives in `release-assets.yml` so that both paths run the
# same code. It was inline here until the automatic path needed it too.

name: Build verified release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or backfill
        required: true
        type: string

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  assets:
    needs: tests
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
