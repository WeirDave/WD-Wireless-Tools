# Build and attach the ZIP and its checksum to a release that already exists.
#
# This used to live inside release.yml. It was lifted out so that the automatic
# release path can reach it too, because **a release created with GITHUB_TOKEN
# does not trigger `release: published`** - GitHub suppresses it to stop
# workflows looping. An auto-tagger that relied on that event would publish a
# release with no ZIP, and an asset-less release is worse than no release: the
# updater and both install scripts refuse a download whose checksum does not
# match, so the user ends up stuck rather than merely out of date.
#
# One implementation, two callers. Duplicating the build into the auto path
# would be the "two implementations of one operation" failure this repo has
# been bitten by before.

name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build release ZIP
        id: package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="WD-Wireless-Tools-${RELEASE_TAG}.zip"

          # build_release.py refuses if the tag does not match versions.json's
          # "suite" at this ref, which is the check that caught v2.103.14.
          python scripts/build_release.py \
            --version "$version" \
            --output "$asset"

          # The in-app updater and install.ps1/install.sh refuse to install a
          # ZIP whose hash does not match this manifest.
          sha256sum "$asset" | awk '{print $1"  "$2}' > "$asset.sha256"
          cat "$asset.sha256"

          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256" \
            --clobber
