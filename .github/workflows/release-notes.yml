# A release note is published by committing it to docs/releases/vX.Y.Z.md.
#
# auto-release.yml publishes a stub, and the finished note used to need
# `gh release edit` on a machine that had gh. This applies the committed note
# instead, from either direction:
#
#  * a push to main that adds or changes a note - the release usually exists
#  * a release build that finishes - the note may have been committed first
#
# scripts/apply_release_notes.py skips a note whose release does not exist
# yet, so whichever of the two arrives first, the second one lands it.
#
# This job holds contents: write, so it only ever runs code from main. A
# workflow_run event names the commit the release was built from, and that
# commit is read for its version number with `git show` - as data - rather
# than checked out, because checking out the triggering run's commit in a
# privileged job is the untrusted-checkout pattern.

name: Release notes

on:
  push:
    branches: [main]
    paths:
      - docs/releases/v*.md
  workflow_run:
    workflows: ["Release on version bump"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to apply its committed note to, e.g. v2.175.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Apply committed notes to their releases
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$EVENT" in
            push)
              python scripts/apply_release_notes.py --changed "$BEFORE" "$AFTER" ;;
            workflow_run)
              version="$(git show "$RELEASED_SHA:web/assets/versions.json" | python -c "import json,sys;print(json.load(sys.stdin)['suite'])")"
              python scripts/apply_release_notes.py --tag "v$version" ;;
            workflow_dispatch)
              python scripts/apply_release_notes.py --tag "$INPUT_TAG" ;;
          esac
